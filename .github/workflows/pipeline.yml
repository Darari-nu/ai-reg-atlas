name: daily-pipeline
on:
  schedule:
    - cron: "0 21 * * *" # JST朝6時
  workflow_dispatch:
    inputs:
      first_run_window_days:
        description: "初回遡り日数（バックフィル用。通常は3）"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sweep-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: collect
        run: node scripts/collect.mjs
        env:
          FIRST_RUN_WINDOW_DAYS: ${{ github.event.inputs.first_run_window_days || '3' }}

      - name: triage
        run: node scripts/triage.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: summarize
        run: node scripts/summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: validate
        run: node scripts/validate.mjs

      - name: commit data
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): sweep $(date -u +%F)"
          git push

      - name: file issues (diff-change / needs-review)
        if: ${{ hashFiles('/tmp/pipeline_issues.json') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let issues = [];
            try { issues = JSON.parse(fs.readFileSync('/tmp/pipeline_issues.json', 'utf8')); } catch {}
            for (const i of issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: i.title,
                body: i.body,
                labels: i.labels ?? [],
              });
            }

      # ビルド〜デプロイは同一ワークフロー内（GITHUB_TOKENのpushは他workflowを起動しない §15-2）
      - run: npx astro build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # --- Cloudflare Pages (darari-nu.com/atlas) ---
      # AstroのbaseはHTML内リンクの表記だけを書き換え、ビルド出力の物理ディレクトリ構造は
      # 変えない。dist/をそのままデプロイすると/atlas/配下に実ファイルが存在せずCSS/JSが
      # 全滅する（過去にスタイル崩壊した実績あり）。必ずatlas/に移してからデプロイすること。
      # ローカルの scripts/deploy-cloudflare.sh と同じ手順をCI側に持ってきたもの。
      - name: build for Cloudflare (darari-nu.com/atlas)
        run: |
          rm -rf dist
          npx astro build
        env:
          ASTRO_SITE: https://darari-nu.com
          ASTRO_BASE: /atlas

      - name: restructure into atlas/ subfolder
        run: |
          rm -rf deploy_atlas
          mkdir -p deploy_atlas/atlas
          cp -r dist/. deploy_atlas/atlas/

      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2d979f189135188782792170c8faa73c
          command: pages deploy deploy_atlas --project-name=ai-reg-atlas --branch=main --commit-dirty=true
