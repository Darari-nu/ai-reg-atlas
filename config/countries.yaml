        note: >-
          SB 24-205（Colorado AI Act）が2024年5月に成立。雇用・与信・住宅など重要な決定に使う
          「高リスクAI」の開発者と利用者に合理的注意義務と影響評価を課す。執行は州司法長官で、施行日は延期されている。
        status: enacted
