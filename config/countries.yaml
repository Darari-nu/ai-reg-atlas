# 監視対象国の定義。国の追加はここに1ブロック追記 → 翌日から自動監視（§9）
# URLは2026-06-12時点。月次で死活確認すること
#
# subregions（国の下位区分。米国の州・EU加盟国・中国の直轄市など）は地球儀のマーカー表示専用で、
# 自動監視の対象ではない（official_sources / watch_feeds は国ブロックだけが持つ）。
# 2026-09-19 追加ぶんは data/ のシードと同じく **AIが下書きした人間レビュー前のドラフト**。
# note の成立日・施行日・執行機関は一次ソースで裏を取るまで確定値として扱わないこと。
# sources は死活確認（curl -sIL）済みの政府・議会の一次ページのみ。法案トラッカーの深いURLは
# 会期IDを取り違えやすいので、確度が低いものは機関のトップページに落としてある。
countries:
  - code: eu
    name_ja: EU
    name_en: European Union
    flag: "🇪🇺"
    lat: 50.85
    lng: 4.35
    official_sources: []   # 旧EC related-content RSSは破損(Attribute without value)のため削除。EU AI Actトラッカー等のwatch_feedsで代替
    watch_feeds:
      - { url: "https://artificialintelligenceact.eu/feed/", type: rss }   # EU AI Act専門トラッカー
      - { url: "https://edpb.europa.eu/feed/news_en", type: rss }          # 欧州データ保護会議(EDPB)
    news_queries: ["EU AI Act", "EU AI Act guidelines"]
    subregions:   # EU加盟国。AI法（規則）は直接適用だが、国内実施法と所管当局は加盟国ごとに違う
      - code: eu-de
        name_ja: ドイツ
        name_en: Germany
        lat: 52.52
        lng: 13.40
        note: >-
          AI法の市場監視当局として連邦ネットワーク庁（BNetzA）内にAIサービスデスクを設置。
          国内実施法（AI市場監視法）は審議中で、所管の最終形は未確定。
        status: draft
        sources:
          - "https://www.bundesnetzagentur.de/EN/Home/home_node.html"
      - code: eu-fr
        name_ja: フランス
        name_en: France
        lat: 48.86
        lng: 2.35
        note: >-
          AI法の国内適用でCNIL（情報処理・自由全国委員会）がGDPRとの接続点を担い、
          生成AIの学習データ利用に関する勧告を継続して公表している。
        sources:
          - "https://www.cnil.fr/en/home"
      - code: eu-it
        name_ja: イタリア
        name_en: Italy
        lat: 41.90
        lng: 12.50
        note: >-
          2025年に法律132/2025（AI分野の規定）が官報で公布され、EU域内で最初の国内AI法となった。
          執行はAgIDとACN（国家サイバーセキュリティ庁）の2機関が分担する。
        status: in_force
        sources:
          - "https://www.gazzettaufficiale.it/"
      - code: eu-es
        name_ja: スペイン
        name_en: Spain
        lat: 40.42
        lng: -3.70
        note: >-
          AI法の監督機関としてAESIA（スペインAI監督庁）をア・コルーニャに設置した、EU初の専門当局。
          所管はデジタル変革省。
        status: in_force
        sources:
          - "https://digital.gob.es/"
      - code: eu-nl
        name_ja: オランダ
        name_en: Netherlands
        lat: 52.37
        lng: 4.89
        note: >-
          個人データ保護庁（AP）内にアルゴリズム調整局（DCA）を置き、
          AI法の調整当局としてアルゴリズムのリスク報告を定期公表している。
        sources:
