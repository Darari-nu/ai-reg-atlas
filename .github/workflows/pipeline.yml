name: daily-pipeline
on:
  schedule:
    # 毎時ちょうど(0分)は世界中の利用者が集中し、GitHubが遅延・**取りこぼし**を起こす。
    # 実測: 2026-09-11〜20 の定期実行は毎回106〜165分遅れ、9/21・9/22 は実行そのものが消えた。
    # そのため半端な分に置き、さらに昼に取りこぼし用の2本目を置く（当日巡回済みならスキップする）。
    - cron: "23 21 * * *" # JST 6:23
    - cron: "23 4 * * *" # JST 13:23（取りこぼし拾い）
  workflow_dispatch:
    inputs:
      first_run_window_days:
        description: "初回遡り日数（バックフィル用。通常は3）"
        required: false
        default: "3"

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # 今日すでに巡回済みかを見るだけの軽いジョブ。取りこぼし用の2本目が二重実行しないように
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          last=$(node -p "require('./data/meta.json').last_sweep?.slice(0,10) ?? ''")
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "本日($today)は巡回済みのためスキップする"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "実行する（最終巡回: ${last:-なし} / 本日: $today）"
          fi

  sweep-and-deploy:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Gemini待ち予算(600s×2ステップ)+巡回+buildに対して十分。既定の360分まで走らせない
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: collect
        run: node scripts/collect.mjs
        env:
          FIRST_RUN_WINDOW_DAYS: ${{ github.event.inputs.first_run_window_days || '3' }}

      - name: triage
        run: node scripts/triage.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 以下は Repository Variables。未設定なら空文字→コードの既定値
          GEMINI_MODEL_TRIAGE: ${{ vars.GEMINI_MODEL_TRIAGE }}
          GEMINI_FALLBACK_TRIAGE: ${{ vars.GEMINI_FALLBACK_TRIAGE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}
          TRIAGE_BATCH_SIZE: ${{ vars.TRIAGE_BATCH_SIZE }}

      - name: summarize
        run: node scripts/summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_SUMMARIZE: ${{ vars.GEMINI_MODEL_SUMMARIZE }}
          GEMINI_FALLBACK_SUMMARIZE: ${{ vars.GEMINI_FALLBACK_SUMMARIZE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}
          SUMMARIZE_MAX_PER_RUN: ${{ vars.SUMMARIZE_MAX_PER_RUN }} # 1回に要約する上限。あふれは data/state/queue.json へ繰り越す

      # Claude による解説記事の下書き。キー未登録・クレジット切れ・API障害でも何もせず続行する（スクリプトが常に exit 0）。
      # 下書きはサイトに出ない。公開は darari の OK 後に scripts/explainer-publish.mjs で行う
      - name: explain
        continue-on-error: true
        run: node scripts/explain.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 以下は Repository Variables。未設定なら空文字→コードの既定値
          EXPLAINER_MODEL: ${{ vars.EXPLAINER_MODEL }}
          EXPLAINER_MAX_PER_RUN: ${{ vars.EXPLAINER_MAX_PER_RUN }}
          EXPLAINER_MAX_INPUT_CHARS: ${{ vars.EXPLAINER_MAX_INPUT_CHARS }}
          EXPLAINER_AUTO_PUBLISH: ${{ vars.EXPLAINER_AUTO_PUBLISH }}

      - name: validate
        run: node scripts/validate.mjs

      - name: commit data
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): sweep $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (probably a concurrent push to main), rebasing and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 5
          done
          git push

      # hashFiles() はワークスペース外(/tmp)を見られず常にスキップされていたので、存在確認はスクリプト内で行う（2026-09-13）
      - name: file issues (diff-change / needs-review)
        continue-on-error: true # 起票失敗でビルド・デプロイを止めない
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = '/tmp/pipeline_issues.json';
            if (!fs.existsSync(file)) { core.info('no issues to file'); return; }
            let issues = [];
            try { issues = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) { core.warning(`unreadable ${file}: ${e.message}`); return; }
            const { owner, repo } = context.repo;
            // 同じタイトルの Issue が開いていれば重ねて立てない（毎日同じ失敗で埋まらないように）
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const openTitles = new Set(open.map((i) => i.title));
            let created = 0;
            for (const i of issues) {
              if (openTitles.has(i.title)) { core.info(`skip (already open): ${i.title}`); continue; }
              try {
                await github.rest.issues.create({ owner, repo, title: i.title, body: i.body, labels: i.labels ?? [] });
                openTitles.add(i.title);
                created++;
              } catch (e) {
                core.warning(`failed to file "${i.title}": ${e.message}`);
              }
            }
            core.info(`filed ${created}/${issues.length} issues`);

      # 情報源が3日続けて止まった/復旧した通知。collect が積んだ /tmp/pipeline_notifications.json を送る。
      # DISCORD_WEBHOOK_URL 未登録なら何もしない。送信失敗でも落とさない（スクリプトが常に exit 0）
      - name: notify discord
        run: node scripts/notify-discord.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # ビルドが通ることだけ確認する（公開は cf-deploy.yml が workflow_run で引き継ぐ）。
      # GitHub Pages への併載は 2026-09-19 に終了した
      - run: npx astro build
