name: daily-pipeline
on:
  schedule:
    - cron: "0 21 * * *" # JST朝6時
  workflow_dispatch:
    inputs:
      first_run_window_days:
        description: "初回遡り日数（バックフィル用。通常は3）"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sweep-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Gemini待ち予算(600s×2ステップ)+巡回+buildに対して十分。既定の360分まで走らせない
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: collect
        run: node scripts/collect.mjs
        env:
          FIRST_RUN_WINDOW_DAYS: ${{ github.event.inputs.first_run_window_days || '3' }}

      - name: triage
        run: node scripts/triage.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 以下は Repository Variables。未設定なら空文字→コードの既定値
          GEMINI_MODEL_TRIAGE: ${{ vars.GEMINI_MODEL_TRIAGE }}
          GEMINI_FALLBACK_TRIAGE: ${{ vars.GEMINI_FALLBACK_TRIAGE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}
          TRIAGE_BATCH_SIZE: ${{ vars.TRIAGE_BATCH_SIZE }}

      - name: summarize
        run: node scripts/summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_SUMMARIZE: ${{ vars.GEMINI_MODEL_SUMMARIZE }}
          GEMINI_FALLBACK_SUMMARIZE: ${{ vars.GEMINI_FALLBACK_SUMMARIZE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}
          SUMMARIZE_MAX_PER_RUN: ${{ vars.SUMMARIZE_MAX_PER_RUN }} # 1回に要約する上限。あふれは data/state/queue.json へ繰り越す

      - name: validate
        run: node scripts/validate.mjs

      - name: commit data
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): sweep $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (probably a concurrent push to main), rebasing and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 5
          done
          git push

      # hashFiles() はワークスペース外(/tmp)を見られず常にスキップされていたので、存在確認はスクリプト内で行う（2026-09-13）
      - name: file issues (diff-change / needs-review)
        continue-on-error: true # 起票失敗でビルド・デプロイを止めない
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = '/tmp/pipeline_issues.json';
            if (!fs.existsSync(file)) { core.info('no issues to file'); return; }
            let issues = [];
            try { issues = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) { core.warning(`unreadable ${file}: ${e.message}`); return; }
            const { owner, repo } = context.repo;
            // 同じタイトルの Issue が開いていれば重ねて立てない（毎日同じ失敗で埋まらないように）
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const openTitles = new Set(open.map((i) => i.title));
            let created = 0;
            for (const i of issues) {
              if (openTitles.has(i.title)) { core.info(`skip (already open): ${i.title}`); continue; }
              try {
                await github.rest.issues.create({ owner, repo, title: i.title, body: i.body, labels: i.labels ?? [] });
                openTitles.add(i.title);
                created++;
              } catch (e) {
                core.warning(`failed to file "${i.title}": ${e.message}`);
              }
            }
            core.info(`filed ${created}/${issues.length} issues`);

      # ビルド〜デプロイは同一ワークフロー内（GITHUB_TOKENのpushは他workflowを起動しない §15-2）
      - run: npx astro build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # darari-nu.com/atlas への反映は cf-deploy.yml が workflow_run で引き継ぐ
