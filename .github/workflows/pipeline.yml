name: daily-pipeline
on:
  schedule:
    - cron: "0 21 * * *" # JST朝6時
  workflow_dispatch:
    inputs:
      first_run_window_days:
        description: "初回遡り日数（バックフィル用。通常は3）"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sweep-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: collect
        run: node scripts/collect.mjs
        env:
          FIRST_RUN_WINDOW_DAYS: ${{ github.event.inputs.first_run_window_days || '3' }}

      - name: triage
        run: node scripts/triage.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: summarize
        run: node scripts/summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: validate
        run: node scripts/validate.mjs

      # L2条文全文。ソースのsha256が同じなら何も書き換えないので、改正が入った日だけ差分が立つ。
      # EUR-Lexやe-Govが落ちていても日次パイプライン全体は止めない（ニュース収集のほうが本業）。
      - name: fulltext
        run: node scripts/fetch-fulltext.mjs
        continue-on-error: true

      - name: commit data
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): sweep $(date -u +%F)"
          git push

      - name: file issues (diff-change / needs-review)
        # hashFiles()はGITHUB_WORKSPACE配下しか解決できず、/tmp配下だと常に空文字列になり
        # このステップ自体が永久にスキップされていた(2ヶ月間needs-review Issueが0件だった実障害)。
        # ワークスペース内の.pipeline-cache/に変更(scripts/lib/pipeline.mjsのISSUES_FILEと一致させる)。
        if: ${{ hashFiles('.pipeline-cache/pipeline_issues.json') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let issues = [];
            try { issues = JSON.parse(fs.readFileSync('.pipeline-cache/pipeline_issues.json', 'utf8')); } catch {}
            for (const i of issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: i.title,
                body: i.body,
                labels: i.labels ?? [],
              });
            }

      # ビルド〜デプロイは同一ワークフロー内（GITHUB_TOKENのpushは他workflowを起動しない §15-2）
      - run: npx astro build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
