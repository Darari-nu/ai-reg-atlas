name: daily-pipeline
on:
  schedule:
    - cron: "0 21 * * *" # JST朝6時
  workflow_dispatch:
    inputs:
      first_run_window_days:
        description: "初回遡り日数（バックフィル用。通常は3）"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  sweep-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Gemini待ち予算(600s×2ステップ)+巡回+buildに対して十分。既定の360分まで走らせない
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: collect
        run: node scripts/collect.mjs
        env:
          FIRST_RUN_WINDOW_DAYS: ${{ github.event.inputs.first_run_window_days || '3' }}

      - name: triage
        run: node scripts/triage.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 以下は Repository Variables。未設定なら空文字→コードの既定値
          GEMINI_MODEL_TRIAGE: ${{ vars.GEMINI_MODEL_TRIAGE }}
          GEMINI_FALLBACK_TRIAGE: ${{ vars.GEMINI_FALLBACK_TRIAGE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}
          TRIAGE_BATCH_SIZE: ${{ vars.TRIAGE_BATCH_SIZE }}

      - name: summarize
        run: node scripts/summarize.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_SUMMARIZE: ${{ vars.GEMINI_MODEL_SUMMARIZE }}
          GEMINI_FALLBACK_SUMMARIZE: ${{ vars.GEMINI_FALLBACK_SUMMARIZE }}
          GEMINI_WAIT_BUDGET_SEC: ${{ vars.GEMINI_WAIT_BUDGET_SEC }}

      - name: validate
        run: node scripts/validate.mjs

      - name: commit data
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): sweep $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (probably a concurrent push to main), rebasing and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 5
          done
          git push

      - name: file issues (diff-change / needs-review)
        if: ${{ hashFiles('/tmp/pipeline_issues.json') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let issues = [];
            try { issues = JSON.parse(fs.readFileSync('/tmp/pipeline_issues.json', 'utf8')); } catch {}
            for (const i of issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: i.title,
                body: i.body,
                labels: i.labels ?? [],
              });
            }

      # ビルド〜デプロイは同一ワークフロー内（GITHUB_TOKENのpushは他workflowを起動しない §15-2）
      - run: npx astro build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # darari-nu.com/atlas への反映は cf-deploy.yml が workflow_run で引き継ぐ
