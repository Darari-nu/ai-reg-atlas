# 出典ドメインの分類（2026-09-26 新設）。collect の報道フィルタと、更新レコードの source_kind 判定に使う。
# official: 公式扱いする追加ドメイン。政府系 TLD（.gov / .gov.xx / .go.kr / .go.jp / .gc.ca / .gob.xx / .gouv.fr / europa.eu / nic.in / leg.br / parliament.uk）
#   と countries.yaml の official_sources のホストは自動で公式扱いになるので、ここにはそれ以外だけ書く。
# trusted_media: 出典に使ってよい報道機関（サブドメインも含む）。ここに無い報道は collect で落とす。追加・削除はこのファイルだけで行う。
